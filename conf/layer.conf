# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have a packages directory, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "qcom-3rdparty"
BBFILE_PATTERN_qcom-3rdparty := "^${LAYERDIR}/"
BBFILE_PRIORITY_qcom-3rdparty = "5"

LAYERDEPENDS_qcom-3rdparty = "core qcom"
LAYERSERIES_COMPAT_qcom-3rdparty = "blacksail"

# The openembedded-layer dependency is needed because chicdk-kodiak
# provided by meta-qcom also depends on it.
BBFILES_DYNAMIC += " \
    openembedded-layer:${LAYERDIR}/dynamic-layers/openembedded-layer/*/*/*.bb \
    openembedded-layer:${LAYERDIR}/dynamic-layers/openembedded-layer/*/*/*.bbappend \
    qcom-distro:${LAYERDIR}/dynamic-layers/qcom-distro/*/*/*.bb \
    qcom-distro:${LAYERDIR}/dynamic-layers/qcom-distro/*/*/*.bbappend \
"
